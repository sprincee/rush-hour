# The baristas: pull orders from the line and make them. No Service, because
# nothing connects to them. They reach out to Redis for work.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: barista
  namespace: rush-hour
  labels:
    app: barista
spec:
  replicas: 2
  selector:
    matchLabels:
      app: barista
  template:
    metadata:
      labels:
        app: barista
    spec:
      enableServiceLinks: false
      # Time to finish the current drink after SIGTERM, before a forced kill.
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: barista
          image: rush-hour-barista:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: SHOP_CONFIG
              value: /config/config.json
            # How a free barista picks the next ticket: fifo, walkin, mobile, or weighted.
            # scripts/rush.ps1 -Rule changes it for a rush, to match a game level.
            - name: TICKET_RULE
              value: fifo
            - name: MOBILE_EVERY
              value: "3"
            # Steam milk for two lattes at once ("on" or "off"), and how many real
            # seconds to hold a lone latte for a partner (1 real second = 1 shop minute).
            - name: BATCH
              value: "off"
            - name: BATCH_WAIT
              value: "0"
          volumeMounts:
            - name: shop-config
              mountPath: /config
              readOnly: true
          ports:
            - name: metrics
              containerPort: 9100
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        # shop/config.json, loaded by scripts/up.ps1: the menu and prep times shared with the game.
        - name: shop-config
          configMap:
            name: shop-config
