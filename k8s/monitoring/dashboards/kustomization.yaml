# Packages the dashboard file as a ConfigMap. Grafana's sidecar loads any
# ConfigMap labeled grafana_dashboard=1.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
configMapGenerator:
  - name: rush-hour-dashboard
    files:
      - rush-hour.json
