# The load generator lives in its own namespace, so a quota can cap it without
# touching the shop. The rush script itself is loaded by scripts/rush.ps1.
apiVersion: v1
kind: Namespace
metadata:
  name: rush-load
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: rush-load-quota
  namespace: rush-load
spec:
  hard:
    pods: "2"
    count/jobs.batch: "2"
    requests.cpu: 500m
    requests.memory: 512Mi
    limits.cpu: "1"
    limits.memory: 512Mi
