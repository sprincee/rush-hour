# The course home page. A lesson with a `page` is playable; the rest show as coming soon.
title = "Rush Hour"
heading = "Learn system design by running a coffee shop"
tagline = "Design the shop, send in the morning rush, then flip on the X-ray to see the queues, workers and APIs underneath. Every lesson is checked against a real Kubernetes cluster."
# The calibration receipt on the homepage. Keys must come before the first [[table]].
proof_date = "2026-11-12"
proof_total = "10 of 10 match within 10%"
# The survey after lesson 8: a Google Form's link (the "Send" > link option). Empty shows
# the questions without the form.
survey_url = "https://docs.google.com/forms/d/e/1FAIpQLSc2IaSv0dfqW5kan7ShJ3Kwri9uaWBi8RQOJrw6yYkcyx52KQ/viewform"

# The real system, listed on the About page.
[[stack]]
name = "Browser game"
role = "Event-based simulation, plain JavaScript, no framework"

[[stack]]
name = "Kubernetes (k3s)"
role = "Runs the register, the baristas, and the rush"

[[stack]]
name = "Redis Streams"
role = "The ticket rails: walk-in and app queues, with crash recovery"

[[stack]]
name = "Python and FastAPI"
role = "The register's order API and the barista workers"

[[stack]]
name = "k6"
role = "Sends each rush: the same customers the game simulates"

[[stack]]
name = "Prometheus and Grafana"
role = "Measures every rush, with the game's goals as SLOs"

# How a level works, shown in the start flow.
[[steps]]
name = "Read the brief"
sys = "Requirements"
text = "A rush is coming. You get goals, like nobody waits more than 15 minutes, and a budget."

[[steps]]
name = "Design the shop"
sys = "Architecture"
text = "Hire baristas, add a ticket rail, pick who gets served first. Every part has a real system design name."

[[steps]]
name = "Run the rush"
sys = "Load test"
text = "Your design is locked in and the customers arrive. Press the X-ray monitor to watch the system underneath."

[[steps]]
name = "Read the receipt"
sys = "SLOs and metrics"
text = "See which goals you met, what happened and why, and the concept behind it. Then try a better design."

