# The course home page. A lesson with a `page` is playable; the rest show as coming soon.
title = "Rush Hour"
heading = "Learn system design by running a coffee shop"
tagline = "Design the shop, send in the morning rush, and X-ray it to see the software system behind it. Every lesson is also checked against a real Kubernetes cluster."

